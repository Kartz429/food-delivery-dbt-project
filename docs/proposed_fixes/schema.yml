version: 2
models:
  - name: fact_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_sk
        tests:
          - not_null
          - relationships: {to: ref('dim_customers_scd2'), field: customer_sk}
      - name: status
        tests:
          - accepted_values: {values: ['delivered', 'cancelled']}
  - name: dim_customers_scd2
    columns:
      - name: customer_sk
        tests: [unique, not_null]
